{% extends 'base.html' %}

{% block title %}Farmer Login – Apla Shetkari{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-tractor"></i>
            </div>
            <h1 class="auth-title">Farmer Login</h1>
            <p class="auth-subtitle">नमस्कार! Welcome back to your Smart Farming Portal</p>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
            <!-- Mobile or Email Identifier -->
            <div class="form-group">
                <label class="form-label" for="identifier">
                    <i class="fas fa-user-circle" style="color: var(--primary-main);"></i> Mobile Number or Email
                </label>
                <input 
                    type="text" 
                    name="identifier" 
                    id="identifier" 
                    class="form-control" 
                    placeholder="Enter your 10-digit mobile or email address" 
                    value="{{ identifier or '' }}"
                    required 
                    autofocus
                >
            </div>

            <!-- Password with visibility toggle -->
            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock" style="color: var(--primary-main);"></i> Password
                </label>
                <div class="password-input-group">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Enter your password" 
                        required
                    >
                    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-sign-in-alt"></i> Login to Portal
                </button>
            </div>
        </form>

        <!-- Switch to Register -->
        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 14.5px;">
            <p>
                Don't have an account yet? 
                <a href="{{ url_for('register') }}" style="font-weight: 700; color: var(--primary-main); text-decoration: underline;">
                    Register here (नवीन खाते तयार करा)
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
